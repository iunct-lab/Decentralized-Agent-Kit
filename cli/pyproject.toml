[project]
name = "dak-cli"
version = "0.1.0"
description = "CLI tool for Decentralized Agent Kit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=15.0.0",
    "requests>=2.31.0",
    "prompt_toolkit>=3.0.0",
    "agent-client-protocol>=0.12.1,<0.13",
]

[project.scripts]
dak-cli = "src.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a running agent (set DAK_AGENT_URL)",
]

