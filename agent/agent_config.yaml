mcp_servers:
  - name: "local-mcp"
    url: "http://mcp-server:8000/mcp"
    type: "http"
    send_session_key: true  # DAK の mcp-server だけに書く。他のサーバには X-DAK-Session-Key（利用者 ID とセッション ID）を送らない

a2a_peers:
  - name: "agent_provider"
    url: "http://agent-provider:8000/a2a/dak_agent"  # the peer's A2A endpoint (https unless on localhost); or set card_url
    capabilities: ["premium_service"]
    # card_public_key_file: /run/secrets/peer-card.pub.pem  # the peer's card-signing public key (docs/architecture/a2a.md §7). Omit = unchecked

# Tool permission rules, appended after the defaults in dak_agent/permission.py
# (the last matching rule wins). source: local | default | caller | <MCP URL>;
# tool / pattern are globs (pattern matches run_command's command or a path).
# action: allow | ask | deny.
permissions: []
#  - {source: default, tool: run_command, pattern: "pytest *", action: allow}
#  - {source: caller, tool: write_file, action: ask}
