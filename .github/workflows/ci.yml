name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    # 鍵の値が履歴に入っていないかを全履歴で確かめる（#289）。ルールは .gitleaks.toml
    runs-on: ubuntu-latest
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Self-test (the Langfuse rule detects a dummy key)
        run: |
          # 鍵の形をファイルに書かないよう、実行時に組み立てる
          if printf 'K=%s-lf-%s\n' sk 0f3a9c2e-7b41-4d8a-9e6f-1c2b3d4e5f60 \
            | docker run --rm -i -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" stdin --no-banner --redact; then
            echo "::error::.gitleaks.toml の langfuse-key ルールがダミーの鍵を検出しなかった"; exit 1
          fi
      - name: Scan full history
        run: docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" git /repo --no-banner --redact --log-opts=--all

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [agent, cli, mcp-server, bff, maintenance]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "${{ matrix.component }}/uv.lock"
      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: uv sync
      - name: Run unit tests
        working-directory: ${{ matrix.component }}
        run: uv run pytest -q
      - name: Run scripts tests
        if: matrix.component == 'maintenance'  # 保守とセキュリティの道具（scripts/setup・scripts/security）
        run: uv run --no-project --with pytest pytest scripts -q

  license:
    # 依存のライセンスを方針と照らす（PBI #344。docs/maintenance/license-policy.md）。一覧は成果物に残す
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [agent, cli, mcp-server, bff, maintenance]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            ${{ matrix.component }}/uv.lock
            maintenance/uv.lock
      - name: Check dependency licenses
        run: ./scripts/license_check.sh ${{ matrix.component }}
      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-report-${{ matrix.component }}
          path: license-report/

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Create empty .env for compose
        run: touch .env
      - name: Build and start the stack (fake LLM, no API keys)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml build
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --wait
      - name: Run integration tests
        working-directory: tests/integration
        run: |
          uv sync
          uv run pytest -q
      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color > compose-logs.txt
      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs.txt
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
