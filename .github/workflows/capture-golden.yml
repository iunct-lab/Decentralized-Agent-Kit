name: Capture golden

# 実LLMスタックでプロンプトを実行し、観測したツール系列を決定論的 golden として
# 凍結し、PR として提案する（要件6「使うほど育つテスト資産」の自動化）。
# 手動起動。nightly-eval とは独立。
# PR は専用トークン GOLDEN_PR_TOKEN で作る（GITHUB_TOKEN で作った PR では CI が
# 起動せず、リポジトリ設定でも Actions の PR 作成を許していない。#498）。
on:
  workflow_dispatch:
    inputs:
      name:
        description: "golden case name"
        required: true
      prompt:
        description: "prompt to send to the agent"
        required: true
      model:
        description: "Ollama model"
        default: "llama3.1:8b"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check GOLDEN_PR_TOKEN
        env:
          GOLDEN_PR_TOKEN: ${{ secrets.GOLDEN_PR_TOKEN }}
        run: '[ -n "$GOLDEN_PR_TOKEN" ] || { echo "::error::secret GOLDEN_PR_TOKEN is not set (docs/maintenance/README.md)"; exit 1; }'

      - name: Cache Ollama models
        uses: actions/cache@v6
        with:
          path: ~/.ollama
          key: ollama-${{ github.event.inputs.model }}

      - name: Install and start Ollama
        timeout-minutes: 15
        env:
          MODEL: ${{ github.event.inputs.model }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # インストーラが systemd サービスとして 127.0.0.1 バインドの ollama を
          # 自動起動しうる。それが残っていると手動起動が port 競合で死んでも
          # localhost への health check は通ってしまうため、先に確実に止める。
          sudo systemctl stop ollama 2>/dev/null || true
          # 既定の 127.0.0.1 バインドではコンテナから host-gateway 経由で届かない。
          # agent コンテナ（host.docker.internal → ホストのゲートウェイ IP）から
          # 到達できるよう全インターフェースで listen する。
          OLLAMA_HOST=0.0.0.0:11434 nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break || sleep 1; done
          # コンテナ視点での到達性を起動前に検証し、届かないなら silent 500 の
          # 連鎖ではなくここで大きく失敗させる。
          docker run --rm --add-host host.docker.internal:host-gateway \
            curlimages/curl -sf http://host.docker.internal:11434/api/version
          # ~4.9GB の pull は一過性のネットワーク断で落ちやすい。リトライで
          # 夜間シグナルが丸ごと欠ける事態を減らす（timeout-minutes が上限）。
          for attempt in 1 2 3; do
            ollama pull "$MODEL" && break
            [ "$attempt" = 3 ] && exit 1
            echo "pull failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done

      - uses: astral-sh/setup-uv@v7

      - name: Start stack against host Ollama
        env:
          LOCAL_MODEL_NAME: ollama_chat/${{ github.event.inputs.model }}
        run: |
          touch .env
          docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.local-llm.yml \
            up -d --build --wait

      - name: Capture golden
        working-directory: tests/integration
        run: |
          uv sync
          uv run python tools/capture_golden.py \
            --name "${{ github.event.inputs.name }}" \
            --prompt "${{ github.event.inputs.prompt }}"

      - name: Open PR with the new golden
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GOLDEN_PR_TOKEN }}
          branch: golden/${{ github.event.inputs.name }}
          title: "test(golden): add replay case ${{ github.event.inputs.name }}"
          commit-message: "test(golden): capture ${{ github.event.inputs.name }}"
          labels: eval, automation
          body: |
            自動生成された golden replay ケース。
            実LLM (`${{ github.event.inputs.model }}`) で観測したツール系列を決定論テスト化しました。
            マージ前に `tests/integration/golden/${{ github.event.inputs.name }}.json` を確認してください。

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.local-llm.yml down -v
