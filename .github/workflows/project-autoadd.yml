name: Add to Project

# 新規 Issue / PR を自動で GitHub Project に追加する。
# すべての作業を Project 上で一元管理するための土台（要件1）。
#
# pull_request ではなく pull_request_target を使う: このジョブは PR コードの
# checkout や実行を一切行わず（add-to-project は GitHub API 呼び出しのみ）、
# 通常 pull_request_target で懸念される「信頼できない PR コードを特権シークレット
# で実行する」リスクが存在しない。一方 Dependabot が起点の pull_request イベントは
# 別ストア（"Dependabot secrets"）からしか secrets が供給されず、通常の Actions
# secrets である DAK_PROJECT_TOKEN が空になって必ず失敗していた
# （dependency-triage.yml 冒頭のコメント参照）。pull_request_target なら常に
# 通常の Actions secrets が使われるため、この問題が起きない。
on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    # Project 未設定（DAK_PROJECT_URL が無い）はスキップして失敗にしない。
    if: ${{ vars.DAK_PROJECT_URL != '' }}
    steps:
      - uses: actions/add-to-project@v2.0.0
        id: add
        with:
          # Project の URL を Variables に登録して使う（root の ops.config.json の projectUrl と同じ）。
          # 例: gh variable set DAK_PROJECT_URL --body "https://github.com/users/teeppp/projects/N"
          project-url: ${{ vars.DAK_PROJECT_URL }}
          github-token: ${{ secrets.DAK_PROJECT_TOKEN }}
      # 新しい Issue の Status を Backlog にする（Status 未設定のときだけ。
      # 既に整理済み・再オープンの Issue の Status は変えない）。
      - name: Initialize new Issue status
        if: ${{ github.event_name == 'issues' && steps.add.outputs.itemId != '' }}
        uses: actions/github-script@v9
        env:
          PROJECT_ITEM_ID: ${{ steps.add.outputs.itemId }}
        with:
          github-token: ${{ secrets.DAK_PROJECT_TOKEN }}
          script: |
            const itemId = process.env.PROJECT_ITEM_ID;
            const { node: item } = await github.graphql(`query($id: ID!) {
              node(id: $id) { ... on ProjectV2Item {
                fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                project { id field(name: "Status") { ... on ProjectV2SingleSelectField { id options { id name } } } }
              } }
            }`, { id: itemId });
            if (item.fieldValueByName) return;
            const field = item.project.field;
            const backlog = field.options.find(option => option.name === 'Backlog');
            if (!backlog) throw new Error("The Project's Status field has no 'Backlog' option: add it in the Project's settings (Status field → Add option 'Backlog'; see docs/maintenance/README.md)");
            await github.graphql(`mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project, itemId: $item, fieldId: $field,
                value: { singleSelectOptionId: $option }
              }) { projectV2Item { id } }
            }`, { project: item.project.id, item: itemId, field: field.id, option: backlog.id });
