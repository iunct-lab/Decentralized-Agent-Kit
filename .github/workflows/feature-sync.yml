name: Feature sync

# 週次: 最近更新された依存の release notes から「新機能」を抽出し取り込み Issue を起票（要件3）。
# provider 中立（MAINT_LLM_*）。changelog は決定論取得なので Web 検索不要。
# MAINT_LLM_* 未設定なら提案 0 件（失敗しない）。
on:
  schedule:
    - cron: "0 6 * * 1" # 毎週月曜 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  # MAINT_LLM_MODEL=bedrock/...: assume the Bedrock role over OIDC (IAM, no API key).
  id-token: write
  issues: write
  # `gh pr list --search` (deps 収集) 用。付けないと GITHUB_TOKEN の scope が
  # 暗黙に none になり検索が失敗しうる。
  pull-requests: read

jobs:
  feature-sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAINT_LLM_BASE_URL: ${{ vars.MAINT_LLM_BASE_URL }}
      MAINT_LLM_MODEL: ${{ vars.MAINT_LLM_MODEL }}
      MAINT_LLM_API_KEY: ${{ secrets.MAINT_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "maintenance/uv.lock"
      - name: AWS credentials for Bedrock (OIDC)
        id: aws
        if: ${{ vars.MAINT_AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.MAINT_AWS_ROLE_ARN }}
          aws-region: ${{ vars.MAINT_AWS_REGION || 'us-east-1' }}
          # Only the step that calls the LLM gets them (not uv sync, not issue creation).
          output-credentials: true
          output-env-credentials: false

      - name: Collect recently updated deps
        working-directory: maintenance
        run: |
          # マージ済み "deps" ラベル PR の本文から依存を集める（グループ更新の
          # "Updates `<pkg>` from a to b" 行と、単発の "Bumps [<pkg>](url) from a to b."）。
          # 抽出は dak-maint collect-deps（maintenance/tests/test_collect_deps.py）。
          # 以前はここでパイプとヒアドキュメントの両方を python の標準入力に向けており、
          # gh の出力が捨てられて毎週 JSONDecodeError で止まっていた（#157）。
          set -o pipefail  # gh の失敗を、次の手順の解析エラーに隠さない
          uv sync
          since=$(date -u -d '14 days ago' +%Y-%m-%d)
          gh pr list --state merged --search "label:deps merged:>=$since" \
            --limit 30 --json body \
            | uv run dak-maint collect-deps --max-items 10 > deps.json
          cat deps.json

      - name: Generate proposals
        working-directory: maintenance
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: ${{ vars.MAINT_AWS_REGION || 'us-east-1' }}
        run: |
          set -o pipefail  # 取得の失敗を、空の比べる相手として黙って進めない
          # 内容で比べる相手: 要望・PBI と、このワークフローが起票したもの（開いた・閉じた）
          for l in type:request type:pbi feature-sync; do
            gh issue list --label "$l" --state all --limit 1000 --json number,title,state
          done | jq -s 'add | unique_by(.number)' > existing.json
          uv run dak-maint feature-sync \
            --deps "$(cat deps.json)" \
            --charter ../docs/CHARTER.md \
            --existing-issues existing.json \
            --max-items 2 > proposals.json
          cat proposals.json

      - name: Create request issues
        working-directory: maintenance
        env:
          # GITHUB_TOKEN で作った Issue は project-autoadd を起動しないので、
          # request_issue.py が Project への追加と Status=Backlog を自分で行う。
          DAK_PROJECT_URL: ${{ vars.DAK_PROJECT_URL }}
          DAK_PROJECT_TOKEN: ${{ secrets.DAK_PROJECT_TOKEN }}
        run: python3 ../scripts/setup/request_issue.py proposals.json --source feature-sync
