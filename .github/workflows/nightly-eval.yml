name: Nightly eval

# 夜間: CPU ランナー上で小型 Ollama モデルを起動し、ゲート済みの実LLMスモークを
# 寛容なアサーションで実行する。継続的な「実モデル」品質シグナル（要件6）。
# PR ゲートではないので continue-on-error で、落ちても情報として記録する。
on:
  schedule:
    - cron: "0 3 * * *" # 毎日 03:00 UTC
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model (LiteLLM format is added automatically)"
        default: "llama3.1:8b"

permissions:
  contents: write # history.jsonl 追記コミット用（main が保護されている場合は soft fail）

env:
  # llama3.2:3b was the original default but has never produced a passing
  # run (docs/eval/history.jsonl: pass_rate 0.0 every night since inception)
  # — it doesn't reliably emit structured tool calls. README.md's own
  # real-LLM smoke test table recommends llama3.1:8b as the model that
  # actually passes; use that here too so this signal means something.
  MODEL: ${{ github.event.inputs.model || 'llama3.1:8b' }}

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Cache Ollama models
        uses: actions/cache@v6
        with:
          path: ~/.ollama
          key: ollama-${{ env.MODEL }}

      - name: Install and start Ollama
        timeout-minutes: 15
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # インストーラが systemd サービスとして 127.0.0.1 バインドの ollama を
          # 自動起動しうる。それが残っていると手動起動が port 競合で死んでも
          # localhost への health check は通ってしまうため、先に確実に止める。
          sudo systemctl stop ollama 2>/dev/null || true
          # 既定の 127.0.0.1 バインドではコンテナから host-gateway 経由で届かない。
          # agent コンテナ（host.docker.internal → ホストのゲートウェイ IP）から
          # 到達できるよう全インターフェースで listen する。
          OLLAMA_HOST=0.0.0.0:11434 nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break || sleep 1; done
          # コンテナ視点での到達性を起動前に検証し、届かないなら silent 500 の
          # 連鎖ではなくここで大きく失敗させる。
          docker run --rm --add-host host.docker.internal:host-gateway \
            curlimages/curl -sf http://host.docker.internal:11434/api/version
          # ~4.9GB の pull は一過性のネットワーク断で落ちやすい。リトライで
          # 夜間シグナルが丸ごと欠ける事態を減らす（timeout-minutes が上限）。
          for attempt in 1 2 3; do
            ollama pull "$MODEL" && break
            [ "$attempt" = 3 ] && exit 1
            echo "pull failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done

      - name: Start stack against host Ollama
        env:
          LOCAL_MODEL_NAME: ollama_chat/${{ env.MODEL }}
        run: |
          touch .env
          docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.local-llm.yml \
            up -d --build --wait

      - name: Run gated real-LLM smoke (tolerant)
        id: smoke
        continue-on-error: true
        timeout-minutes: 45
        working-directory: tests/integration
        env:
          DAK_SMOKE_REAL_LLM: "1"
          # llama3.1:8b was validated (README) on Metal-GPU-accelerated Ollama;
          # this runner does CPU-only inference, which can be substantially
          # slower per turn. Give it more headroom than the 120s default so a
          # slow-but-working turn doesn't get miscounted as a tool-calling
          # failure; timeout-minutes above still bounds the worst case.
          # 300s was enough for 3/4 tests on the first connected run
          # (2026-08-28: pass_rate 0.75) but test_skill_discovery_and_use —
          # the heaviest prompt (most tools) — still hit ReadTimeout; 600s
          # gives the slowest turn CPU headroom without unbounding the job.
          DAK_AGENT_RUN_TIMEOUT: "600"
        run: |
          uv sync
          uv run pytest -q test_smoke_real_llm.py --junitxml=eval-report.xml

      - name: Summarize and append history
        if: always()
        working-directory: maintenance
        run: |
          uv sync
          uv run dak-maint eval-record --junit ../tests/integration/eval-report.xml \
            --history ../docs/eval/history.jsonl --model "$MODEL"

      - name: Commit history (soft-fail if main protected)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/eval/history.jsonl
          git commit -m "chore(eval): nightly pass-rate [skip ci]" || echo "nothing to commit"
          git push || echo "push failed (protected branch?) — artifact に残ります"

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-eval
          path: |
            tests/integration/eval-report.xml
            docs/eval/history.jsonl
            ollama.log

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.local-llm.yml down -v
