name: Nightly eval

# 夜間: CPU ランナー上で小型 Ollama モデルを起動し、ゲート済みの実LLMスモークを
# 寛容なアサーションで実行する。継続的な「実モデル」品質シグナル（要件6）。
# PR ゲートではないので continue-on-error で、落ちても情報として記録する。
on:
  schedule:
    - cron: "0 3 * * *" # 毎日 03:00 UTC
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model (LiteLLM format is added automatically)"
        default: "llama3.1:8b"
      profile:
        description: "DAK_HARNESS_PROFILE（空なら未指定）"
        default: ""
      provider:
        description: "経路。bedrock は有料（OIDC の一時クレデンシャル、月の回数上限あり。docs/eval/cloud-eval.md）"
        type: choice
        options: [ollama, bedrock]
        default: ollama
      cloud_model:
        description: "provider=bedrock のときの LiteLLM のモデル名"
        default: "bedrock/us.openai.gpt-5.6-luna"

permissions:
  contents: write # リリース eval-history の asset（history.jsonl）の差し替え用

# 記録は git の外のリリース eval-history の asset に持つ（docs/eval/README.md）。
# 取得 → 追記 → 差し替えの間に別の実行が割り込むと行が消えるので、1 本ずつ回す。
concurrency:
  group: nightly-eval-history
  cancel-in-progress: false

env:
  # llama3.2:3b was the original default but has never produced a passing
  # run (docs/eval/history.jsonl: pass_rate 0.0 every night since inception)
  # — it doesn't reliably emit structured tool calls. README.md's own
  # real-LLM smoke test table recommends llama3.1:8b as the model that
  # actually passes; use that here too so this signal means something.
  MODEL: ${{ github.event.inputs.model || 'llama3.1:8b' }}
  # ハーネスプロファイル（agent/profiles/<名前>.yaml）。空ならモデル名の pattern で解決する。
  # 行に profile として残り、同じ model のあり/なしの pass_rate を見比べられる（docs/eval/README.md）。
  DAK_HARNESS_PROFILE: ${{ github.event.inputs.profile || '' }}

jobs:
  eval:
    # schedule には inputs が無いので、Ollama の経路が既定
    if: github.event_name == 'schedule' || inputs.provider == 'ollama'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Cache Ollama models
        uses: actions/cache@v6
        with:
          path: ~/.ollama
          key: ollama-${{ env.MODEL }}

      - name: Install and start Ollama
        timeout-minutes: 15
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # インストーラが systemd サービスとして 127.0.0.1 バインドの ollama を
          # 自動起動しうる。それが残っていると手動起動が port 競合で死んでも
          # localhost への health check は通ってしまうため、先に確実に止める。
          sudo systemctl stop ollama 2>/dev/null || true
          # 既定の 127.0.0.1 バインドではコンテナから host-gateway 経由で届かない。
          # agent コンテナ（host.docker.internal → ホストのゲートウェイ IP）から
          # 到達できるよう全インターフェースで listen する。
          OLLAMA_HOST=0.0.0.0:11434 nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break || sleep 1; done
          # コンテナ視点での到達性を起動前に検証し、届かないなら silent 500 の
          # 連鎖ではなくここで大きく失敗させる。
          docker run --rm --add-host host.docker.internal:host-gateway \
            curlimages/curl -sf http://host.docker.internal:11434/api/version
          # ~4.9GB の pull は一過性のネットワーク断で落ちやすい。リトライで
          # 夜間シグナルが丸ごと欠ける事態を減らす（timeout-minutes が上限）。
          for attempt in 1 2 3; do
            ollama pull "$MODEL" && break
            [ "$attempt" = 3 ] && exit 1
            echo "pull failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done

      - name: Start stack against host Ollama
        env:
          LOCAL_MODEL_NAME: ollama_chat/${{ env.MODEL }}
        run: |
          touch .env
          docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.local-llm.yml \
            up -d --build --wait

      - name: Run gated real-LLM smoke (tolerant)
        id: smoke
        continue-on-error: true
        timeout-minutes: 45
        working-directory: tests/integration
        env:
          DAK_SMOKE_REAL_LLM: "1"
          # llama3.1:8b was validated (README) on Metal-GPU-accelerated Ollama;
          # this runner does CPU-only inference, which can be substantially
          # slower per turn. Give it more headroom than the 120s default so a
          # slow-but-working turn doesn't get miscounted as a tool-calling
          # failure; timeout-minutes above still bounds the worst case.
          # 300s was enough for 3/4 tests on the first connected run
          # (2026-08-28: pass_rate 0.75) but test_skill_discovery_and_use —
          # the heaviest prompt (most tools) — still hit ReadTimeout; 600s
          # gives the slowest turn CPU headroom without unbounding the job.
          DAK_AGENT_RUN_TIMEOUT: "600"
        run: |
          uv sync
          uv run pytest -q test_smoke_real_llm.py --junitxml=eval-report.xml

      # 5 つの uv.lock の脆弱性の ID を記録の材料にする（uv audit は preview。落ちても nightly は落とさない）。
      - name: Audit lock files
        if: always()
        run: |
          set -uo pipefail
          uv --version
          mkdir -p "$RUNNER_TEMP/audit"
          for dir in agent mcp-server bff cli tests/integration; do
            (cd "$dir" && uv audit --frozen --preview-features audit-command,json-output \
              --output-format json > "$RUNNER_TEMP/audit/$(basename "$dir").json") || true
          done

      - name: Summarize and append history
        id: record
        if: always()
        working-directory: maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY: ${{ github.workspace }}/eval-history/history.jsonl
        run: |
          gh release download eval-history -R "$GITHUB_REPOSITORY" -p history.jsonl -D "$(dirname "$HISTORY")"
          uv sync
          uv run dak-maint eval-record --junit ../tests/integration/eval-report.xml \
            --history "$HISTORY" --model "$MODEL" --profile "$DAK_HARNESS_PROFILE" \
            --audit-dir "$RUNNER_TEMP/audit"

      # 差し替えに失敗したときは、この写しから asset を戻す（docs/eval/README.md）。
      # 写しが上がらなかった晩は差し替えない（Publish history の条件）。
      - name: Upload eval artifacts
        id: artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-eval
          path: |
            tests/integration/eval-report.xml
            eval-history/history.jsonl
            ollama.log

      - name: Publish history
        if: always() && steps.record.outcome == 'success' && steps.artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload eval-history -R "$GITHUB_REPOSITORY" eval-history/history.jsonl --clobber

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.local-llm.yml down -v

  # 手動起動で provider=bedrock を選んだときだけ。長期の鍵は置かず、GitHub OIDC で
  # 得た一時クレデンシャルで回す。変数が未設定・月の上限に達していれば何も起動せず成功で終わる。
  eval-bedrock:
    if: github.event_name == 'workflow_dispatch' && inputs.provider == 'bedrock'
    runs-on: ubuntu-latest
    environment: cloud-eval
    permissions:
      contents: write # asset の差し替え用
      id-token: write # OIDC
    concurrency:
      group: cloud-eval
      cancel-in-progress: false
    timeout-minutes: 50
    env:
      CLOUD_MODEL_NAME: ${{ inputs.cloud_model }}
      DAK_HARNESS_PROFILE: ${{ inputs.profile }}
      HISTORY: ${{ github.workspace }}/eval-history/history.jsonl
    steps:
      - name: Check Bedrock role variables
        id: gate
        env:
          ROLE_ARN: ${{ vars.DAK_BEDROCK_ROLE_ARN }}
          REGION: ${{ vars.DAK_BEDROCK_REGION }}
        run: |
          if [ -z "$ROLE_ARN" ] || [ -z "$REGION" ]; then
            echo "- Bedrock のロールが未設定のため省略（変数 DAK_BEDROCK_ROLE_ARN / DAK_BEDROCK_REGION。docs/eval/cloud-eval.md）" >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.configured == 'true'

      - uses: astral-sh/setup-uv@v7
        if: steps.gate.outputs.configured == 'true'

      # LLM を呼ぶ前に、今月の bedrock の行数で上限を判定する（allowed=false なら以降は飛ばす）
      - name: Check monthly budget
        id: budget
        if: steps.gate.outputs.configured == 'true'
        working-directory: maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ vars.DAK_CLOUD_EVAL_MONTHLY_LIMIT || 4 }}
        run: |
          gh release download eval-history -R "$GITHUB_REPOSITORY" -p history.jsonl -D "$(dirname "$HISTORY")"
          uv sync
          uv run dak-maint eval-budget --history "$HISTORY" --provider bedrock --limit "$LIMIT"

      - name: Configure AWS credentials (OIDC)
        if: steps.budget.outputs.allowed == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DAK_BEDROCK_ROLE_ARN }}
          aws-region: ${{ vars.DAK_BEDROCK_REGION }}
          role-duration-seconds: 3600

      - name: Start stack against Bedrock
        if: steps.budget.outputs.allowed == 'true'
        env:
          AWS_REGION_NAME: ${{ vars.DAK_BEDROCK_REGION }}
        run: |
          touch .env
          docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.cloud-llm.yml \
            up -d --build --wait

      - name: Run gated real-LLM smoke (tolerant)
        id: smoke
        if: steps.budget.outputs.allowed == 'true'
        continue-on-error: true
        timeout-minutes: 45
        working-directory: tests/integration
        env:
          DAK_SMOKE_REAL_LLM: "1"
          DAK_AGENT_RUN_TIMEOUT: "120"
        run: |
          uv sync
          uv run pytest -q test_smoke_real_llm.py --junitxml=eval-report.xml

      - name: Summarize and append history
        id: record
        if: always() && steps.budget.outputs.allowed == 'true'
        working-directory: maintenance
        run: |
          uv run dak-maint eval-record --junit ../tests/integration/eval-report.xml \
            --history "$HISTORY" --model "$CLOUD_MODEL_NAME" --provider bedrock \
            --runner github-hosted --profile "$DAK_HARNESS_PROFILE"

      - name: Upload eval artifacts
        id: artifact
        if: always() && steps.budget.outputs.allowed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nightly-eval-bedrock
          path: |
            tests/integration/eval-report.xml
            eval-history/history.jsonl

      - name: Publish history
        if: always() && steps.record.outcome == 'success' && steps.artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload eval-history -R "$GITHUB_REPOSITORY" eval-history/history.jsonl --clobber

      - name: Tear down
        if: always() && steps.budget.outputs.allowed == 'true'
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml -f docker-compose.cloud-llm.yml down -v
