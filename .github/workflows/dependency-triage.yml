name: Dependency triage

# Dependabot PR を判定し、安全なものは自動マージを有効化、そうでなければ
# needs-human-review ラベル + リスク要約コメントを付ける（要件2）。
#
# セキュリティ設計:
#   - pull_request_target なので base ブランチのコード（= 信頼できる maintenance/）を
#     チェックアウトして実行する。PR の（信頼できない）コードは実行しない。
#   - Dependabot イベントの秘密情報は "Dependabot secrets" ストアから供給される
#     （通常の Actions secrets とは別。docs/maintenance/README.md 参照）。
#   - 実際のマージは `gh pr merge --auto` が担い、branch protection の必須チェック
#     （CI）が green になるまで GitHub 側が保留する。ここでは可否だけ決める。
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  triage:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base (trusted) code
        uses: actions/checkout@v7

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "maintenance/uv.lock"

      # uv の更新だけ、更新前（base）と更新後（PR の head）の uv.lock を audit して、直る脆弱性を判定の材料に渡す。
      # PR の head の pyproject.toml / uv.lock はデータとして API で取り、一時ディレクトリで audit するだけ
      # （PR のコードのビルド・インストール・実行はしない）。自動マージの可否は変えない。
      - name: Audit lock files
        id: audit
        if: ${{ steps.meta.outputs.package-ecosystem == 'uv' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRECTORY: ${{ steps.meta.outputs.directory }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          dir="${DIRECTORY#/}"
          if ! [[ "$dir" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$dir" == *..* ]]; then
            echo "skip: 対象ディレクトリを audit に使えない"; exit 0
          fi
          for side in before after; do mkdir -p "$RUNNER_TEMP/audit-$side"; done
          for f in pyproject.toml uv.lock .python-version; do
            [ -f "$dir/$f" ] && cp "$dir/$f" "$RUNNER_TEMP/audit-before/$f"
            gh api "repos/$GITHUB_REPOSITORY/contents/$dir/$f?ref=$HEAD_SHA" \
              -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/audit-after/$f" 2>/dev/null \
              || rm -f "$RUNNER_TEMP/audit-after/$f"
          done
          for side in before after; do
            [ -f "$RUNNER_TEMP/audit-$side/uv.lock" ] || { echo "skip: $side の uv.lock が無い"; exit 0; }
            (cd "$RUNNER_TEMP/audit-$side" &&
              uv audit --frozen --preview-features audit-command,json-output --output-format json \
                > "$RUNNER_TEMP/audit-$side.json" 2>"$RUNNER_TEMP/audit-$side.err") || true
            echo "audit $side: $(head -c 300 "$RUNNER_TEMP/audit-$side.err")"
          done
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Run triage engine
        id: triage
        working-directory: maintenance
        env:
          # Tier1 LLM（任意）。未設定ならヒューリスティック判定にフォールバック。
          MAINT_LLM_BASE_URL: ${{ vars.MAINT_LLM_BASE_URL }}
          MAINT_LLM_MODEL: ${{ vars.MAINT_LLM_MODEL }}
          MAINT_LLM_API_KEY: ${{ secrets.MAINT_LLM_API_KEY }}
          # 明示指定（vars.MAINT_ASSESSOR）があればそれを優先。未設定の場合、
          # 以前は常に 'heuristic' にフォールバックしており、MAINT_LLM_* を
          # 設定済みでも Tier1 LLM が一度も使われていなかった。dak-maint の
          # OpenAI 互換は BASE_URL/MODEL、Anthropic native は MODEL/API_KEY
          # で選ぶ。keyless local な Ollama 等はキーを要求しない。
          MAINT_ASSESSOR: ${{ vars.MAINT_ASSESSOR }}
          # グループ化PR（複数パッケージ）でも各パッケージの実際の from/to を使うため
          # dependency-names（カンマ結合の単一文字列）ではなく updated-dependencies-json
          # （パッケージごとの構造化データ）を渡す。
          UPDATED_DEPS_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
          AUDIT_DONE: ${{ steps.audit.outputs.done }}
        run: |
          set -euo pipefail
          uv sync
          deps_json=$(jq -c '[.[] | {package: .dependencyName, from: .prevVersion, to: .newVersion}]' <<< "$UPDATED_DEPS_JSON")
          assessor="$MAINT_ASSESSOR"
          if [ -z "$assessor" ]; then
            if { [[ "$MAINT_LLM_MODEL" != anthropic/* ]] && [ -n "$MAINT_LLM_BASE_URL" ] && [ -n "$MAINT_LLM_MODEL" ]; } ||
               { [[ "$MAINT_LLM_MODEL" == anthropic/* ]] && [ -n "$MAINT_LLM_API_KEY" ]; }; then
              assessor="llm"
            else
              assessor="heuristic"
            fi
          fi
          echo "assessor=$assessor"
          audit_args=()
          if [ "${AUDIT_DONE:-}" = "true" ]; then
            audit_args=(--audit-before "$RUNNER_TEMP/audit-before.json" --audit-after "$RUNNER_TEMP/audit-after.json")
          fi
          uv run dak-maint triage \
            --deps-json "$deps_json" \
            --ci-passed true \
            --fetch-changelog \
            --assessor "$assessor" \
            "${audit_args[@]}"

      - name: Apply decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          ACTION: ${{ steps.triage.outputs.action }}
          LABELS: ${{ steps.triage.outputs.labels }}
          REASON: ${{ steps.triage.outputs.reason }}
          RISK: ${{ steps.triage.outputs.risk }}
          BUMP: ${{ steps.triage.outputs.bump }}
        run: |
          set -euo pipefail
          [ -n "$LABELS" ] && gh pr edit "$PR_URL" --add-label "$LABELS" || true
          if [ "$ACTION" = "auto-merge" ]; then
            echo "自動マージを有効化（CI green を GitHub が待機）"
            gh pr merge --auto --squash "$PR_URL"
            gh pr comment "$PR_URL" --body "🤖 自動トリアージ: **auto-merge** を有効化 (bump=$BUMP, risk=$RISK)。必須チェックが green になり次第マージされます。理由: $REASON"
          else
            echo "人間レビューを要求"
            gh pr comment "$PR_URL" --body "🤖 自動トリアージ: **人間レビューが必要** (bump=$BUMP, risk=$RISK)。理由: $REASON"
          fi
