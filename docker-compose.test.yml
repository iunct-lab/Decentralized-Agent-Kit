# Integration-test overrides: run the full stack against a deterministic
# fake LLM so no API keys are needed.
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait
#   cd tests/integration && uv run pytest
#   docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

services:
  fake-llm:
    build: ./tests/integration/fake_llm
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      timeout: 5s
      retries: 15

  inspect-server:  # a caller's inspection endpoint (dak:inspection)
    build: ./tests/integration/inspect_server
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      timeout: 5s
      retries: 15

  agent:
    environment:
      - MODEL_NAME=openai/fake-default
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
      - DAK_ALLOWED_MODELS=openai/fake-default,openai/fake-alt
      # tests/integration/test_approvals.py: planner asks for confirmation (an agent-side tool, no MCP server needed)
      - DAK_PLANNER_REQUIRE_CONFIRMATION=true
      - DAK_APPROVAL_TIMEOUT_SECONDS=5
      # The stack's own mcp-server stands in for a caller's MCP server (dak:tools.mcp_servers).
      - DAK_ALLOWED_MCP_URLS=http://mcp-server:8000/mcp,http://caller-mcp-unreachable:8000/mcp
      - DAK_ALLOWED_INSPECTION_URLS=http://inspect-server:8080/validate
    depends_on:
      - postgres
      - fake-llm
      - inspect-server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/list-apps')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  agent-enforcer:
    build: ./agent
    ports:
      - "8010:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://username:password@postgres:5432/postgres
      - SESSION_SERVICE_URI=postgresql+asyncpg://username:password@postgres:5432/postgres
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - MODEL_NAME=openai/fake-enforcer
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
      - ENABLE_ENFORCER_MODE=true
    depends_on:
      - postgres
      - fake-llm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/list-apps')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  agent-ap2:
    build: ./agent
    ports:
      - "8011:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://username:password@postgres:5432/postgres
      - SESSION_SERVICE_URI=postgresql+asyncpg://username:password@postgres:5432/postgres
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - MODEL_NAME=openai/fake-ap2
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
      - ENABLE_AP2_PROTOCOL=true
      - SOLANA_USE_MOCK=true
      - AGENT_SKILLS_DIRS=/app/skills:/app/provider_skills
    depends_on:
      - postgres
      - fake-llm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/list-apps')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # tests/integration/test_request_snapshot.py: the sliding-window compaction
  # runs every 3 invocations (the fake LLM's usage never reaches the token threshold).
  agent-harness-eval:
    build: ./agent
    ports:
      - "8012:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://username:password@postgres:5432/postgres
      - SESSION_SERVICE_URI=postgresql+asyncpg://username:password@postgres:5432/postgres
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - MODEL_NAME=openai/fake-harness
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
      - MODEL_CONTEXT_WINDOW=4000
      - DAK_COMPACTION_INTERVAL=3
    depends_on:
      - postgres
      - fake-llm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/list-apps')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # tests/integration/test_a2a.py -k delegation: one DAK hands a task to another
  # over A2A. The peer's card is named dak_peer (not dak_agent); the consumer finds
  # it from the peer's endpoint URL in its a2a_peers, not from a hardcoded name.
  # ADK's RemoteA2aAgent takes a card (and RPC) URL only over https or plain http
  # on a loopback name; *.localhost counts, so the peer is reached as agent-peer.localhost.
  agent-peer:
    build: ./agent
    networks:
      default:
        aliases:
          - agent-peer.localhost
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://username:password@postgres:5432/postgres
      - SESSION_SERVICE_URI=postgresql+asyncpg://username:password@postgres:5432/postgres
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - MODEL_NAME=openai/fake-peer
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
      - AGENT_NAME=dak_peer
      - AGENT_PUBLIC_URL=http://agent-peer.localhost:8000/a2a/dak_agent
    depends_on:
      - postgres
      - fake-llm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/list-apps')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  agent-consumer:
    build: ./agent
    ports:
      - "8013:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://username:password@postgres:5432/postgres
      - SESSION_SERVICE_URI=postgresql+asyncpg://username:password@postgres:5432/postgres
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - MODEL_NAME=openai/fake-consumer
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
      - ENABLE_A2A_CONSUMER=true
    volumes:
      - ./tests/integration/fixtures/agent_config.consumer.yaml:/app/agent_config.yaml
    depends_on:
      - postgres
      - fake-llm
      - agent-peer
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/list-apps')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  mcp-server:
    healthcheck:
      # GET /mcp answers 4xx without a proper MCP handshake; any HTTP response means the server is up
      test: ["CMD", "python", "-c", "import urllib.request, urllib.error\ntry:\n    urllib.request.urlopen('http://localhost:8000/mcp')\nexcept urllib.error.HTTPError:\n    pass"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  bff:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
