# Integration-test overrides: run the full stack against a deterministic
# fake LLM so no API keys are needed.
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait
#   cd tests/integration && uv run pytest
#   docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
#
# Web search (test_web_search_flow.py): fake-tavily (8091) stands in for
# Tavily's remote MCP; agent-websearch (8015) is the agent with a key.

services:
  fake-llm:
    build: ./tests/integration/fake_llm
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      timeout: 5s
      retries: 15

  inspect-server:  # a caller's inspection endpoint (dak:inspection)
    build: ./tests/integration/inspect_server
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      timeout: 5s
      retries: 15

  # tests/integration/test_otel_export.py: the OTLP endpoint the agent exports its
  # GenAI spans to. (8091 is fake-tavily's.)
  otlp-sink:
    build: ./tests/integration/otlp_sink
    ports:
      - "8092:4318"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4318/health')"]
      interval: 2s
      timeout: 5s
      retries: 15

  # tests/integration/test_a2a.py -k signature: the Agent Card signing key pair,
  # made when the stack comes up and tests/integration/.keys/ (gitignored) has
  # none yet, so a fresh checkout or CI gets a new pair. No key is in the repository.
  # agent and agent-peer sign with it; agent-consumer checks agent-peer's card, and
  # the tests read the public key on the host to check agent's card.
  card-keygen:
    build: ./agent
    entrypoint: []
    command: ["uv", "run", "python", "/tools/make_card_keys.py", "/keys"]
    volumes:
      - ./tests/integration/tools:/tools:ro
      - ./tests/integration/.keys:/keys

  agent:
    environment:
      - MODEL_NAME=openai/fake-default
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
      # Claude route for tests/integration/test_thinking_blocks.py (the fake LLM's /v1/messages)
      - ANTHROPIC_API_BASE=http://fake-llm:8080
      - ANTHROPIC_API_KEY=dummy
      - DAK_ALLOWED_MODELS=openai/fake-default,openai/fake-alt,anthropic/fake-claude
      # tests/integration/test_approvals.py: planner asks for confirmation (an agent-side tool, no MCP server needed)
      - DAK_PLANNER_REQUIRE_CONFIRMATION=true
      - DAK_APPROVAL_TIMEOUT_SECONDS=5
      # The stack's own mcp-server stands in for a caller's MCP server (dak:tools.mcp_servers).
      - DAK_ALLOWED_MCP_URLS=http://mcp-server:8000/mcp,http://caller-mcp-unreachable:8000/mcp
      - DAK_ALLOWED_INSPECTION_URLS=http://inspect-server:8080/validate
      - AGENT_CARD_SIGNING_KEY_FILE=/keys/card-signing.pem
      - AGENT_CARD_SIGNING_KID=test-1
      # test_web_search_flow.py: this agent has no Tavily key, whatever the host or .env has
      - TAVILY_API_KEY=
      # tests/integration/test_otel_export.py: spans go to otlp-sink (no LangFuse key here)
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otlp-sink:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_BSP_SCHEDULE_DELAY=500
    volumes:
      - ./tests/integration/.keys:/keys:ro
    # map form: docker-compose.yml's list form is merged into it
    depends_on:
      postgres: {condition: service_started}
      fake-llm: {condition: service_started}
      inspect-server: {condition: service_started}
      otlp-sink: {condition: service_started}
      card-keygen: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/list-apps')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  agent-enforcer:
    build: ./agent
    ports:
      - "8010:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://username:password@postgres:5432/postgres
      - SESSION_SERVICE_URI=postgresql+asyncpg://username:password@postgres:5432/postgres
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - MODEL_NAME=openai/fake-enforcer
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
      - ENABLE_ENFORCER_MODE=true
    depends_on:
      - postgres
      - fake-llm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/list-apps')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  agent-ap2:
    build: ./agent
    ports:
      - "8011:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://username:password@postgres:5432/postgres
      - SESSION_SERVICE_URI=postgresql+asyncpg://username:password@postgres:5432/postgres
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - MODEL_NAME=openai/fake-ap2
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
      - ENABLE_AP2_PROTOCOL=true
      - SOLANA_USE_MOCK=true
      - AGENT_SKILLS_DIRS=/app/skills:/app/provider_skills
    depends_on:
      - postgres
      - fake-llm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/list-apps')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # tests/integration/test_web_search_flow.py: Tavily's remote MCP, faked.
  fake-tavily:
    build: ./tests/integration/fake_tavily
    ports:
      - "8091:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 5s
      retries: 15

  # The agent with TAVILY_API_KEY set, pointed at fake-tavily: the web_search
  # skill is on. The key is a fixed test string, not a real Tavily key.
  agent-websearch:
    build: ./agent
    ports:
      - "8015:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://username:password@postgres:5432/postgres
      - SESSION_SERVICE_URI=postgresql+asyncpg://username:password@postgres:5432/postgres
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - MODEL_NAME=openai/fake-websearch
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
      - TAVILY_API_KEY=test-dummy-key
      - TAVILY_MCP_URL=http://fake-tavily:8000/mcp
    depends_on:
      - postgres
      - fake-llm
      - fake-tavily
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/list-apps')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # tests/integration/test_payment_intent_flow.py: agent-ap2 with the payment
  # intent check on. Only a PUBLIC key is trusted; its private key was thrown
  # away, so no intent here can be valid (the allowed case is a unit test).
  agent-ap2-intent:
    build: ./agent
    ports:
      - "8014:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://username:password@postgres:5432/postgres
      - SESSION_SERVICE_URI=postgresql+asyncpg://username:password@postgres:5432/postgres
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - MODEL_NAME=openai/fake-ap2-intent
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
      - ENABLE_AP2_PROTOCOL=true
      - SOLANA_USE_MOCK=true
      - AGENT_SKILLS_DIRS=/app/skills:/app/provider_skills
      - ENABLE_PAYMENT_INTENT_CHECK=true
      - 'DAK_PAYMENT_INTENT_TRUSTED_JWKS={"keys":[{"kty":"EC","crv":"P-256","kid":"it-user","x":"10T0cg1VD4XY7uiC_j1OnEOyks2PccGKKLoaJwqBt5M","y":"NQtXiLZUlbuiycVr-d6rnJ5H9FUGpveTaqi6Vr8bH9c"}]}'
    depends_on:
      - postgres
      - fake-llm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/list-apps')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # tests/integration/test_request_snapshot.py: the sliding-window compaction
  # runs every 3 invocations (the fake LLM's usage never reaches the token threshold).
  agent-harness-eval:
    build: ./agent
    ports:
      - "8012:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://username:password@postgres:5432/postgres
      - SESSION_SERVICE_URI=postgresql+asyncpg://username:password@postgres:5432/postgres
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - MODEL_NAME=openai/fake-harness
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
      - ANTHROPIC_API_BASE=http://fake-llm:8080
      - ANTHROPIC_API_KEY=dummy
      - DAK_ALLOWED_MODELS=openai/fake-harness,anthropic/fake-claude
      - MODEL_CONTEXT_WINDOW=4000
      - DAK_COMPACTION_INTERVAL=3
    depends_on:
      - postgres
      - fake-llm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/list-apps')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # tests/integration/test_a2a.py -k delegation: one DAK hands a task to another
  # over A2A. The peer's card is named dak_peer (not dak_agent); the consumer finds
  # it from the peer's endpoint URL in its a2a_peers, not from a hardcoded name.
  # ADK's RemoteA2aAgent takes a card (and RPC) URL only over https or plain http
  # on a loopback name; *.localhost counts, so the peer is reached as agent-peer.localhost.
  agent-peer:
    build: ./agent
    networks:
      default:
        aliases:
          - agent-peer.localhost
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://username:password@postgres:5432/postgres
      - SESSION_SERVICE_URI=postgresql+asyncpg://username:password@postgres:5432/postgres
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - MODEL_NAME=openai/fake-peer
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
      - AGENT_NAME=dak_peer
      - AGENT_PUBLIC_URL=http://agent-peer.localhost:8000/a2a/dak_agent
      - AGENT_CARD_SIGNING_KEY_FILE=/keys/card-signing.pem
      - AGENT_CARD_SIGNING_KID=test-1
      # its card lists these skills, premium_service included; the consumer reads them (test_a2a.py)
      - AGENT_SKILLS_DIRS=/app/skills:/app/provider_skills
    volumes:
      - ./tests/integration/.keys:/keys:ro
    depends_on:
      postgres: {condition: service_started}
      fake-llm: {condition: service_started}
      card-keygen: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/list-apps')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  agent-consumer:
    build: ./agent
    ports:
      - "8013:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://username:password@postgres:5432/postgres
      - SESSION_SERVICE_URI=postgresql+asyncpg://username:password@postgres:5432/postgres
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - MODEL_NAME=openai/fake-consumer
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
      - ENABLE_A2A_CONSUMER=true
    volumes:
      - ./tests/integration/fixtures/agent_config.consumer.yaml:/app/agent_config.yaml
      - ./tests/integration/.keys:/keys:ro
    # The consumer fetches agent-peer's card at startup to check its signature
    depends_on:
      postgres: {condition: service_started}
      fake-llm: {condition: service_started}
      agent-peer: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/list-apps')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  # tests/integration/test_lambda_entry.py: the Lambda image (agent/Dockerfile.lambda) run
  # with the runtime interface emulator, read-only root file system, no session database.
  agent-lambda:
    build:
      context: ./agent
      dockerfile: Dockerfile.lambda
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8016:8080"
    environment:
      - MODEL_NAME=openai/fake-lambda
      - OPENAI_API_BASE=http://fake-llm:8080/v1
      - OPENAI_API_KEY=dummy
    depends_on:
      - fake-llm

  mcp-server:
    healthcheck:
      # GET /mcp answers 4xx without a proper MCP handshake; any HTTP response means the server is up
      test: ["CMD", "python", "-c", "import urllib.request, urllib.error\ntry:\n    urllib.request.urlopen('http://localhost:8000/mcp')\nexcept urllib.error.HTTPError:\n    pass"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  bff:
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
